<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gold desk</title><style>
:root{--bg:#e8ecef;--ink:#16222c;--mute:#5d6b76;--line:#c5cdd3;--panel:#f6f8f9;--gold:#a87c1f;--buy:#23785a;--sell:#a8433a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line)}
h1{font:600 22px Georgia,serif;margin:0;color:var(--gold)}h2{font:600 17px Georgia,serif;margin:0 0 8px}
main{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:20px;padding:20px 24px;max-width:1200px;margin:auto}
@media(max-width:800px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);padding:16px 18px}
.verdict{font:600 34px/1.15 Georgia,serif;margin:0 0 6px}.buy{color:var(--buy)}.sell{color:var(--sell)}.wait{color:var(--mute)}
ol{list-style:none;margin:0;padding:0}li.c{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
li.c b{font-weight:600}li.c small{display:block;color:var(--mute);font-size:13px}
.dot{width:12px;height:12px;border-radius:50%;margin-top:6px;border:2px solid var(--mute)}.ok .dot{background:var(--buy);border-color:var(--buy)}.no .dot{background:var(--sell);border-color:var(--sell)}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin:10px 0}.plan div{border-left:3px solid var(--gold);padding-left:10px}.plan span{display:block;color:var(--mute);font-size:13px}.plan strong{font-size:20px}
pre{white-space:pre-wrap;font:inherit;margin:0;max-width:75ch}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:6px 8px;border-top:1px solid var(--line)}
.stack{display:grid;gap:20px}label{display:flex;gap:8px;align-items:center}input[type=range]{accent-color:var(--gold)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold)}.err{color:var(--sell)}.note{color:var(--mute);font-size:13px}
</style></head><body>
<header><h1>Gold desk: XAUUSD</h1><div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center">
<label><input type="checkbox" id="auto"> Auto-execute (demo accounts)</label>
<label>Risk per trade <input type="range" id="risk" min="0.1" max="1" step="0.1"> <span id="rv"></span>%</label></div></header>
<main><div class="stack"><section><h2>Checklist</h2><ol id="chk"></ol></section></div>
<div class="stack"><section><p class="verdict wait" id="v">Loading</p><p id="sub" class="note"></p><div class="plan" id="plan"></div><pre id="exp"></pre></section>
<section><h2>Why not</h2><pre id="why"></pre></section>
<section><h2>Signal log</h2><table><thead><tr><th>Time</th><th>Side</th><th>Entry</th><th>SL</th><th>TP1</th><th>TP2</th><th>Conf.</th><th>Order</th></tr></thead><tbody id="log"></tbody></table>
<p class="note">Decision support, not financial advice. Backtest and demo-test before using real money.</p></section></div></main>
<script>
const $=id=>document.getElementById(id);let busy=false;
async function post(b){const r=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});render(await r.json())}
$('auto').onchange=e=>post({auto:e.target.checked});$('risk').onchange=e=>post({risk:+e.target.value});
function render(s){
 $('auto').checked=s.auto;$('auto').disabled=s.mode!=='mt5';$('risk').value=s.risk;$('rv').textContent=s.risk;
 const L=s.last||{},lv=L.levels;
 const v=$('v');v.className='verdict '+(lv?(lv.direction==='BUY'?'buy':'sell'):'wait');
 v.textContent=lv?lv.direction+' signal':(s.error?'Data error':'No trade right now');
 $('sub').innerHTML=s.error?'<span class="err">'+s.error+'</span>':'Evaluated candles up to '+(L.time||'-')+' ('+s.mode+' data)';
 $('plan').innerHTML=lv?[['Entry',lv.entry],['Stop',lv.sl],['TP1',lv.tp1],['TP2',lv.tp2]].map(x=>`<div><span>${x[0]}</span><strong>${x[1].toFixed(2)}</strong></div>`).join('')+`<div><span>Confidence</span><strong>${lv.confidence}</strong></div>`:'';
 $('exp').textContent=L.explanation||'';$('why').textContent=L.why_not||(lv?'A signal fired, so nothing was skipped.':'');
 $('chk').innerHTML=(L.checks||[]).map(c=>`<li class="c ${c.ok===true?'ok':c.ok===false?'no':''}"><span class="dot"></span><span><b>${c.name}</b><small>${c.detail}</small></span></li>`).join('');
 $('log').innerHTML=(s.log||[]).map(g=>`<tr><td>${g.time}</td><td class="${g.direction==='BUY'?'buy':'sell'}">${g.direction}</td><td>${g.entry.toFixed(2)}</td><td>${g.sl.toFixed(2)}</td><td>${g.tp1.toFixed(2)}</td><td>${g.tp2.toFixed(2)}</td><td>${g.confidence}</td><td>${g.executed||'-'}</td></tr>`).join('')||'<tr><td colspan="8" class="note">No signals yet.</td></tr>';
}
async function poll(){if(busy)return;busy=true;try{render(await (await fetch('/api/state')).json())}catch(e){}busy=false}
poll();setInterval(poll,5000);
</script></body></html>
